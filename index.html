<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Redes Sociales</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* =========================
       FONDO 9:16
    ========================== */

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transform: scale(1.05);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.25),
          rgba(0,0,0,0.55)
        );
      z-index: -1;
    }

    /* =========================
       CRYSTAL CARD
    ========================== */

    .container {
      width: 100%;
      max-width: 420px;
      padding: 34px 24px;
      border-radius: 34px;

      background: rgba(255,255,255,0.02);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border: 1px solid rgba(255,255,255,0.14);

      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(255,255,255,0.05);

      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
      );
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    /* =========================
       LOGO
    ========================== */

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px;

      filter:
        drop-shadow(0 8px 20px rgba(0,0,0,0.35));
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    .description {
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* =========================
       BOTONES BASE
    ========================== */

    .social-btn {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      color: white;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .social-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.25s ease;
      border-radius: 20px;
    }

    .social-btn:hover::after {
      background: rgba(255,255,255,0.12);
    }

    .social-btn:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .social-btn:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* =========================
       DEGRADADOS DE MARCA
    ========================== */

    /* Instagram: morado → rosa → naranja */
    .social-btn.instagram {
      background: linear-gradient(
        135deg,
        #833ab4 0%,
        #fd1d1d 50%,
        #fcb045 100%
      );
      box-shadow: 0 4px 18px rgba(253,29,29,0.35);
    }

    /* Facebook: azul oficial */
    .social-btn.facebook {
      background: linear-gradient(
        135deg,
        #1877f2 0%,
        #0c5ecf 100%
      );
      box-shadow: 0 4px 18px rgba(24,119,242,0.35);
    }

    /* TikTok: negro con acento cyan/rojo */
    .social-btn.tiktok {
      background: linear-gradient(
        135deg,
        #010101 0%,
        #1a1a2e 50%,
        #16213e 100%
      );
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      border: 1px solid rgba(105,201,208,0.4);
    }

    .social-btn.tiktok .icon {
      background: linear-gradient(135deg, #69c9d0, #ee1d52);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 6px rgba(105,201,208,0.6));
    }

    /* WhatsApp: verde oficial */
    .social-btn.whatsapp {
      background: linear-gradient(
        135deg,
        #25d366 0%,
        #128c7e 100%
      );
      box-shadow: 0 4px 18px rgba(37,211,102,0.35);
    }

    .icon {
      font-size: 22px;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .container {
        padding: 28px 18px;
        border-radius: 28px;
      }

      h1 {
        font-size: 25px;
      }

      .social-btn {
        padding: 16px;
        font-size: 15px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }

    }

  </style>
</head>
<body>

  <!-- =========================
       IMAGEN DE FONDO 9:16
  ========================== -->

  <div class="background">
    <img src="fondo.jpg" alt="Fondo">
  </div>

  <div class="overlay"></div>

  <div class="container">

    <div class="profile">

      <img
        class="logo"
        src="logo.png"
        alt="Logo"
      />

      <h1>CLUB NBOBA-T</h1>

      <p class="description">
       ¡Síguenos en cualquiera de nuestras redes sociales para reclamar tu TOPPING GRATIS!
      </p>

    </div>

    <div class="links">

      <button
        class="social-btn instagram"
        onclick="trackClick('Instagram', 'https://www.instagram.com/nbobat_/')"
      >
        <span>Instagram</span>
        <span class="icon">📸</span>
      </button>

      <button
        class="social-btn facebook"
        onclick="trackClick('Facebook', 'https://www.facebook.com/profile.php?id=61572027038950')"
      >
        <span>Facebook</span>
        <span class="icon">👍</span>
      </button>

      <button
        class="social-btn tiktok"
        onclick="trackClick('TikTok', 'tiktok')"
      >
        <span>TikTok</span>
        <span class="icon">🎵</span>
      </button>

      <button
        class="social-btn whatsapp"
        onclick="trackClick('WhatsApp', 'https://wa.me/527773714293?text=Hola%2C%20quiero%20reclamar%20mi%20TOPPING%20GRATIS!%20🎉🍪✨')"
      >
        <span>WhatsApp</span>
        <span class="icon">💬</span>
      </button>
      
    </div>

    <div class="footer">
      © 2026 NBOBA-T. Todos los derechos reservados
    </div>

  </div>

  <script>

    // =============================
    // URL DE APPS SCRIPT
    // =============================

    const API_URL = 'https://script.google.com/macros/s/AKfycbxGZa1Tjdcqr0g3I0EIFAdL4b_rgwaMXkbMfpAnyfQhN6kkJeK3BpykehkvjHorAYAVVg/exec';


    // =============================
    // CIUDAD POR IP
    // =============================

    let ciudad = 'Desconocida';

    async function getGeoData() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        ciudad = (data.city || 'Desconocida') + ', ' + (data.country_name || '');
      } catch(error) {
        console.log('Error obteniendo ciudad:', error);
      }
    }


    // =============================
    // REGISTRAR ESCANEO
    // =============================

    async function registerScan() {
      await getGeoData();
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            evento: 'scan',
            red_social: '',
            ciudad: ciudad,
            user_agent: navigator.userAgent,
            fecha: new Date().toISOString()
          })
        });
      } catch(error) {
        console.log('Error registrando scan:', error);
      }
    }


    // =============================
    // REGISTRAR CLICK Y REDIRIGIR
    // =============================

    async function trackClick(red, url) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            evento: 'click',
            red_social: red,
            ciudad: ciudad,
            user_agent: navigator.userAgent,
            fecha: new Date().toISOString()
          })
        });
      } catch(error) {
        console.log('Error registrando click:', error);
      }

      // TikTok: siempre abrir en navegador
      if (url === 'tiktok') {
        window.open('https://www.tiktok.com/@nbobat', '_blank');
        return;
      }

      window.open(url, '_blank');
    }


    // =============================
    // INICIAR
    // =============================

    registerScan();

  </script>

</body>
</html>
