<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Redes Sociales</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* =========================
       FONDO 9:16
    ========================== */

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transform: scale(1.05);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.25),
          rgba(0,0,0,0.55)
        );
      z-index: -1;
    }

    /* =========================
       CRYSTAL CARD
    ========================== */

    .container {
      width: 100%;
      max-width: 420px;
      padding: 34px 24px;
      border-radius: 34px;

      background: rgba(255,255,255,0.02);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border: 1px solid rgba(255,255,255,0.22);

      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(255,255,255,0.05);

      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
      );
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    /* =========================
       LOGO
    ========================== */

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px;

      filter:
        drop-shadow(0 8px 20px rgba(0,0,0,0.35));
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    .description {
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .social-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      color: white;
      text-decoration: none;

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .social-btn:hover {
      transform: translateY(-4px) scale(1.01);

      background: rgba(255,255,255,0.15);

      box-shadow:
        0 12px 28px rgba(0,0,0,0.22);
    }

    .icon {
      font-size: 22px;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .container {
        padding: 28px 18px;
        border-radius: 28px;
      }

      h1 {
        font-size: 25px;
      }

      .social-btn {
        padding: 16px;
        font-size: 15px;
      }

      .logo {
        width: 100px;
        height: 100px;
      }

    }

  </style>
</head>
<body>

  <!-- =========================
       IMAGEN DE FONDO 9:16
  ========================== -->

  <div class="background">
    <img src="fondo.jpg" alt="Fondo">
  </div>

  <div class="overlay"></div>

  <div class="container">

    <div class="profile">

      <img
        class="logo"
        src="logo.png"
        alt="Logo"
      />

      <h1>Tu Marca</h1>

      <p class="description">
        Síguenos en nuestras redes sociales y mantente al día con todo nuestro contenido.
      </p>

    </div>

    <div class="links">

      <button
        class="social-btn instagram"
        onclick="trackClick('Instagram', 'https://instagram.com')"
      >
        <span>Instagram</span>
        <span class="icon">📸</span>
      </button>

      <button
        class="social-btn facebook"
        onclick="trackClick('Facebook', 'https://facebook.com')"
      >
        <span>Facebook</span>
        <span class="icon">👍</span>
      </button>

      <button
        class="social-btn tiktok"
        onclick="trackClick('TikTok', 'https://tiktok.com')"
      >
        <span>TikTok</span>
        <span class="icon">🎵</span>
      </button>

      <button
        class="social-btn whatsapp"
        onclick="trackClick('WhatsApp', 'https://wa.me/5210000000000')"
      >
        <span>WhatsApp</span>
        <span class="icon">💬</span>
      </button>

      <button
        class="social-btn website"
        onclick="trackClick('Website', 'https://tusitio.com')"
      >
        <span>Sitio Web</span>
        <span class="icon">🌐</span>
      </button>

    </div>

    <div class="footer">
      Escanea • Conecta • Comparte
    </div>

  </div>

  <script>

    // =============================
    // PEGA AQUÍ TU URL DE APPS SCRIPT
    // =============================

    const API_URL = 'https://script.google.com/macros/s/AKfycbxGZa1Tjdcqr0g3I0EIFAdL4b_rgwaMXkbMfpAnyfQhN6kkJeK3BpykehkvjHorAYAVVg/exec';


    // =============================
    // REGISTRAR ESCANEO
    // =============================

    async function registerScan() {

      try {

        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            evento: 'scan',
            red_social: '',
            user_agent: navigator.userAgent,
            fecha: new Date().toISOString()
          })
        });

      } catch(error) {
        console.log('Error registrando scan');
      }

    }


    // =============================
    // REGISTRAR CLICK
    // =============================

    async function trackClick(red, url) {

      try {

        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            evento: 'click',
            red_social: red,
            user_agent: navigator.userAgent,
            fecha: new Date().toISOString()
          })
        });

      } catch(error) {
        console.log('Error registrando click');
      }

      window.location.href = url;

    }


    // =============================
    // INICIAR
    // =============================

    registerScan();

  </script>

</body>
</html>
